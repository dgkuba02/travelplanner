<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Planner Jakub K.</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        overflow-x: hidden;
      }
      .sidebar {
        width: 220px;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        background-color: #f8f9fa;
        padding: 1rem;
        border-right: 1px solid #dee2e6;
      }
      .main {
        margin-left: 230px;
        padding: 2rem;
      }
      .nav-link.active {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h5>Menu</h5>
      <ul class="nav flex-column" id="menu">
        <li class="nav-item">
          <a href="#" class="nav-link active" data-view="calendarView"
            >Kalendarz</a
          >
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-view="summaryView"
            >Podsumowanie podróży</a
          >
        </li>
      </ul>
      <hr />
      <h6>Łączny koszt:</h6>
      <p>
        <strong><span id="totalCost">0</span> PLN</strong>
      </p>
    </div>

    <div class="main">
      <div id="calendarView">
        <div id="calendar"></div>
      </div>
      <div id="summaryView" class="d-none">
        <h3>Podsumowanie podróży</h3>
        <ul class="list-group" id="tripSummaryList"></ul>
      </div>
    </div>

    <div class="modal fade" id="tripModal" tabindex="-1">
      <div class="modal-dialog">
        <form id="tripForm" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Wycieczka</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="country" class="form-label">Kraj</label>
              <input type="text" class="form-control" id="country" required />
            </div>
            <div class="mb-3">
              <label for="city" class="form-label">Miasto</label>
              <input type="text" class="form-control" id="city" required />
            </div>
            <div class="mb-3">
              <label for="cost" class="form-label">Koszt (PLN)</label>
              <input type="number" class="form-control" id="cost" required />
            </div>
            <div class="mb-3">
              <label for="start" class="form-label"
                >Data i godzina rozpoczecia</label
              >
              <input
                type="datetime-local"
                class="form-control"
                id="start"
                required
              />
            </div>
            <div class="mb-3">
              <label for="end" class="form-label"
                >Data i godzina zakonczenia</label
              >
              <input
                type="datetime-local"
                class="form-control"
                id="end"
                required
              />
            </div>
            <div class="mb-3">
              <label for="weather" class="form-label">Pogoda</label>
              <input type="text" class="form-control" id="weather" readonly />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-danger" id="deleteBtn">
              Usuń
            </button>
            <button type="submit" class="btn btn-primary">Zapisz</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@reduxjs/toolkit@1.9.5/dist/redux-toolkit.umd.min.js"></script>

    <script>
      const { configureStore, createSlice } = window.RTK;

      const tripsSlice = createSlice({
        name: "trips",
        initialState: [],
        reducers: {
          addTrip: (state, action) => {
            state.push(action.payload);
          },
          removeTrip: (state, action) =>
            state.filter((trip) => trip.id !== action.payload),
          updateTrip: (state, action) => {
            const index = state.findIndex((t) => t.id === action.payload.id);
            if (index !== -1) state[index] = action.payload;
          },
        },
      });

      const store = configureStore({ reducer: { trips: tripsSlice.reducer } });
      const { addTrip, removeTrip, updateTrip } = tripsSlice.actions;

      const modal = new bootstrap.Modal(document.getElementById("tripModal"));
      let calendar;

      function updateTotalCost() {
        const total = store
          .getState()
          .trips.reduce((sum, t) => sum + t.cost, 0);
        document.getElementById("totalCost").textContent = total;
      }

      function updateTripSummary() {
        const list = document.getElementById("tripSummaryList");
        list.innerHTML = "";
        store.getState().trips.forEach((trip) => {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.innerHTML = `
                    <strong>${trip.city}, ${trip.country}</strong> — ${trip.cost} PLN<br>
                    ${trip.start} → ${trip.end}<br>
                    ☁️ Pogoda: ${trip.weather}`;
          list.appendChild(li);
        });
      }

      async function fetchWeather(city) {
        const apiKey = "";
        const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(
          city
        )}&units=metric&appid=${apiKey}&lang=pl`;

        try {
          console.log("[API] Wysyłane zapytanie:", url);
          const res = await fetch(url);
          if (!res.ok) {
            const errorData = await res.json();
            console.error("[API] Błąd:", res.status, errorData);
            return `Błąd API (${res.status})`;
          }
          const data = await res.json();
          return `${data.weather[0].description}, ${data.main.temp}°C`;
        } catch (e) {
          console.error("[API] Błąd połączenia:", e);
          return "Brak danych";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        calendar = new FullCalendar.Calendar(
          document.getElementById("calendar"),
          {
            initialView: "timeGridWeek",
            headerToolbar: {
              left: "prev,next today",
              center: "title",
              right: "dayGridMonth,timeGridWeek,timeGridDay",
            },
            dateClick: (info) => {
              document.getElementById("tripForm").reset();
              document.getElementById("start").value = info.dateStr.substring(
                0,
                16
              );
              document.getElementById("end").value = info.dateStr.substring(
                0,
                16
              );
              document.getElementById("tripForm").dataset.editingId = "";
              document.getElementById("deleteBtn").style.display = "none";
              modal.show();
            },
            eventClick: (info) => {
              const trip = store
                .getState()
                .trips.find((t) => t.eventId === info.event.id);
              if (!trip) return;
              document.getElementById("country").value = trip.country;
              document.getElementById("city").value = trip.city;
              document.getElementById("cost").value = trip.cost;
              document.getElementById("start").value = trip.start;
              document.getElementById("end").value = trip.end;
              document.getElementById("weather").value = trip.weather;
              document.getElementById("tripForm").dataset.editingId = trip.id;
              document.getElementById("deleteBtn").style.display =
                "inline-block";
              modal.show();
            },
            eventDidMount: function (info) {
              if (info.event.extendedProps.weather) {
                new bootstrap.Tooltip(info.el, {
                  title: `Pogoda: ${info.event.extendedProps.weather}`,
                  placement: "top",
                  trigger: "hover",
                });
              }
            },
          }
        );
        calendar.render();

        document.getElementById("menu").addEventListener("click", (e) => {
          if (e.target.matches("[data-view]")) {
            e.preventDefault();
            document
              .querySelectorAll(".nav-link")
              .forEach((el) => el.classList.remove("active"));
            e.target.classList.add("active");
            const view = e.target.dataset.view;
            document
              .querySelectorAll(".main > div")
              .forEach((div) => div.classList.add("d-none"));
            document.getElementById(view).classList.remove("d-none");
            if (view === "summaryView") updateTripSummary();
          }
        });

        document.getElementById("city").addEventListener("blur", async () => {
          const city = document.getElementById("city").value;
          const weather = await fetchWeather(city);
          document.getElementById("weather").value = weather;
        });

        document.getElementById("tripForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const id =
            document.getElementById("tripForm").dataset.editingId || Date.now();
          const country = document.getElementById("country").value;
          const city = document.getElementById("city").value;
          const cost = parseFloat(document.getElementById("cost").value);
          const start = document.getElementById("start").value;
          const end = document.getElementById("end").value;
          const weather = document.getElementById("weather").value;

          if (document.getElementById("tripForm").dataset.editingId) {
            const trip = store.getState().trips.find((t) => t.id == id);
            calendar.getEventById(trip.eventId).remove();
            calendar.addEvent({
              id: trip.eventId,
              title: `${city}, ${cost} PLN`,
              start,
              end,
              extendedProps: { weather },
            });
            store.dispatch(
              updateTrip({
                id: trip.id,
                country,
                city,
                cost,
                start,
                end,
                weather,
                eventId: trip.eventId,
              })
            );
          } else {
            const event = calendar.addEvent({
              id: String(id),
              title: `${city}, ${cost} PLN`,
              start,
              end,
              extendedProps: { weather },
            });
            store.dispatch(
              addTrip({
                id,
                country,
                city,
                cost,
                start,
                end,
                weather,
                eventId: event.id,
              })
            );
          }

          updateTotalCost();
          updateTripSummary();
          modal.hide();
        });

        document.getElementById("deleteBtn").addEventListener("click", () => {
          const id = parseInt(
            document.getElementById("tripForm").dataset.editingId
          );
          const trip = store.getState().trips.find((t) => t.id === id);
          if (trip) {
            store.dispatch(removeTrip(trip.id));
            calendar.getEventById(trip.eventId).remove();
            updateTotalCost();
            updateTripSummary();
            modal.hide();
          }
        });
      });
    </script>
  </body>
</html>
